<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Coaster Code</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="application">

    <!-- =========================================================
         EDITOR
         ========================================================= -->

    <section
        id="editorPage"
        class="page active">

        <div class="editor-layout">

            <!-- =================================================
                 LEFT CRT FORCE GRAPHS
                 ================================================= -->

            <aside class="graph-lab-left">

                <div class="crt-unit">

                    <div class="crt-bezel">

                        <div class="crt-screen">

                            <canvas
                                id="verticalGraphCanvas"
                                width="500"
                                height="220">
                            </canvas>

                        </div>

                    </div>

                    <div class="crt-logo">
                        VECTOR//01
                    </div>

                    <div class="crt-cable cable-one"></div>

                </div>


                <div class="crt-unit">

                    <div class="crt-bezel">

                        <div class="crt-screen">

                            <canvas
                                id="lateralGraphCanvas"
                                width="500"
                                height="220">
                            </canvas>

                        </div>

                    </div>

                    <div class="crt-logo">
                        G-FORCE
                    </div>

                    <div class="crt-cable cable-two"></div>

                </div>


                <div class="crt-unit">

                    <div class="crt-bezel">

                        <div class="crt-screen">

                            <canvas
                                id="forwardGraphCanvas"
                                width="500"
                                height="220">
                            </canvas>

                        </div>

                    </div>

                    <div class="crt-logo">
                        RAIL//MATRIX
                    </div>

                    <div class="crt-cable cable-three"></div>

                </div>

            </aside>


            <!-- =================================================
                 CENTER WORLD
                 ================================================= -->

            <section class="world-panel">

                <div class="world-container">

                    <canvas
                        id="worldCanvas"
                        width="1000"
                        height="700">
                    </canvas>

                </div>

                <button
                    id="simulateButton"
                    class="simulate-button">

                    <img
                        src="icons/ui/simulate.png"
                        alt="">

                </button>

            </section>


            <!-- =================================================
                 RIGHT PAPER GRAPHS
                 ================================================= -->

            <aside class="graph-lab-right">

                <div class="paper-folder">

                    <div class="folder-tab">
                        SPEED
                    </div>

                    <div class="paper-sheet">

                        <canvas
                            id="speedGraphCanvas"
                            width="500"
                            height="220">
                        </canvas>

                        <div class="pencil-placeholder"></div>

                    </div>

                </div>


                <div class="paper-folder">

                    <div class="folder-tab">
                        HEIGHT
                    </div>

                    <div class="paper-sheet">

                        <canvas
                            id="heightGraphCanvas"
                            width="500"
                            height="220">
                        </canvas>

                        <div class="pencil-placeholder"></div>

                    </div>

                </div>


                <div class="paper-folder">

                    <div class="folder-tab">
                        BANKING
                    </div>

                    <div class="paper-sheet">

                        <canvas
                            id="bankingGraphCanvas"
                            width="500"
                            height="220">
                        </canvas>

                        <div class="pencil-placeholder"></div>

                    </div>

                </div>

            </aside>


            <!-- =================================================
                 BOTTOM CONTROL DESK
                 ================================================= -->

            <section class="track-editor">


                <!-- =================================================
                     THREE CONTROL COLUMNS
                     ================================================= -->

                <div class="track-editor-columns">


                    <!-- =============================================
                         COLUMN 1
                         ============================================= -->

                    <div class="editor-column preview-column">

                        <div class="preview-track-display">

                            <div class="preview-grid"></div>

                            <canvas
                                id="previewCanvas"
                                width="500"
                                height="300">
                            </canvas>

                        </div>

                    </div>


                    <!-- =============================================
                         COLUMN 2
                         TURNS / SLOPE / BUILD
                         ============================================= -->

                    <div class="editor-column construction-column">


                        <!-- Turns -->

                        <div class="turn-controls">

                            <button
                                class="track-button turn-button"
                                data-type="direction"
                                data-value="left">

                                <img
                                    src="icons/ui/direction-left.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button turn-button"
                                data-type="direction"
                                data-value="straight">

                                <img
                                    src="icons/ui/direction-straight.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button turn-button"
                                data-type="direction"
                                data-value="right">

                                <img
                                    src="icons/ui/direction-right.png"
                                    alt="">

                            </button>

                        </div>


                        <!-- Slope -->

                        <div class="slope-grid">

                            <button
                                class="track-button slope-button"
                                data-type="slope"
                                data-value="down-vertical">

                                <img
                                    src="icons/ui/slope-down-vertical.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button slope-button"
                                data-type="slope"
                                data-value="down-steep">

                                <img
                                    src="icons/ui/slope-down-steep.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button slope-button"
                                data-type="slope"
                                data-value="down-shallow">

                                <img
                                    src="icons/ui/slope-down-shallow.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button slope-button"
                                data-type="slope"
                                data-value="straight">

                                <img
                                    src="icons/ui/slope-straight.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button slope-button"
                                data-type="slope"
                                data-value="up-shallow">

                                <img
                                    src="icons/ui/slope-up-shallow.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button slope-button"
                                data-type="slope"
                                data-value="up-steep">

                                <img
                                    src="icons/ui/slope-up-steep.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button slope-button"
                                data-type="slope"
                                data-value="up-vertical">

                                <img
                                    src="icons/ui/slope-up-vertical.png"
                                    alt="">

                            </button>

                        </div>


                        <!-- Operation settings -->

                        <div
                            id="operationSettings"
                            class="operation-settings hidden">

                            <div class="operation-setting-row">

                                <label for="operationSpeed">
                                    SPEED
                                </label>

                                <input
                                    id="operationSpeed"
                                    type="number"
                                    value="20"
                                    min="0">

                            </div>


                            <div class="operation-setting-row">

                                <label for="operationAcceleration">
                                    ACCELERATION
                                </label>

                                <input
                                    id="operationAcceleration"
                                    type="number"
                                    value="1"
                                    min="0"
                                    step="0.1">

                            </div>

                        </div>


                        <!-- Build / undo / clear -->

                        <div class="build-row">

                            <button
                                id="undoButton"
                                class="round-action undo-action"
                                title="Undo">

                                <span class="eraser-shape"></span>

                            </button>


                            <button
                                id="buildButton"
                                class="build-button">

                                BUILD TRACK

                            </button>


                            <button
                                id="clearButton"
                                class="round-action clear-action"
                                title="Clear">

                                <span class="eraser-shape whiteout"></span>

                            </button>

                        </div>


                        <button
                            id="cancelButton"
                            class="cancel-button">

                            CANCEL

                        </button>

                    </div>


                    <!-- =============================================
                         COLUMN 3
                         BANKING / MODIFIERS
                         ============================================= -->

                    <div class="editor-column banking-column">


                        <!-- =========================================
                             RADIAL BANKING CONTROL
                             ========================================= -->

                        <div class="banking-control">

                            <!-- Decorative radial guide -->

                            <div class="banking-ring"></div>


                            <!-- Top inverted -->

                            <button
                                class="track-button banking-button banking-inverted"
                                data-type="banking"
                                data-value="vertical-left">

                                <img
                                    src="icons/ui/bank-vertical-left.png"
                                    alt="">

                            </button>


                            <!-- Upper-left vertical -->

                            <button
                                class="track-button banking-button banking-vertical-left"
                                data-type="banking"
                                data-value="vertical-left">

                                <img
                                    src="icons/ui/bank-vertical-left.png"
                                    alt="">

                            </button>


                            <!-- Left elevated -->

                            <button
                                class="track-button banking-button banking-left"
                                data-type="banking"
                                data-value="left">

                                <img
                                    src="icons/ui/bank-left.png"
                                    alt="">

                            </button>


                            <!-- Center -->

                            <button
                                class="track-button banking-button banking-none"
                                data-type="banking"
                                data-value="none">

                                <img
                                    src="icons/ui/bank-none.png"
                                    alt="">

                            </button>


                            <!-- Right elevated -->

                            <button
                                class="track-button banking-button banking-right"
                                data-type="banking"
                                data-value="right">

                                <img
                                    src="icons/ui/bank-right.png"
                                    alt="">

                            </button>


                            <!-- Upper-right vertical -->

                            <button
                                class="track-button banking-button banking-vertical-right"
                                data-type="banking"
                                data-value="vertical-right">

                                <img
                                    src="icons/ui/bank-vertical-right.png"
                                    alt="">

                            </button>

                        </div>


                        <!-- =========================================
                             SPECIAL MODIFIERS
                             ========================================= -->

                        <div class="modifier-row">

                            <button
                                class="track-button operation-button"
                                data-type="operation"
                                data-value="none">

                                <img
                                    src="icons/ui/operation-none.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button operation-button"
                                data-type="operation"
                                data-value="launch">

                                <img
                                    src="icons/ui/operation-launch.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button operation-button"
                                data-type="operation"
                                data-value="lift">

                                <img
                                    src="icons/ui/operation-lift.png"
                                    alt="">

                            </button>


                            <button
                                class="track-button operation-button"
                                data-type="operation"
                                data-value="brake">

                                <img
                                    src="icons/ui/operation-brake.png"
                                    alt="">

                            </button>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     CONNECTED DRAWERS
                     ================================================= -->

                <nav class="desk-drawers">


                    <button
                        class="desk-drawer active"
                        data-page="editorPage">

                        <span class="drawer-label">
                            EDITOR
                        </span>

                        <span class="drawer-handle"></span>

                    </button>


                    <button
                        class="desk-drawer"
                        data-page="tokenizerPage">

                        <span class="drawer-label">
                            TOKENIZER
                        </span>

                        <span class="drawer-handle"></span>

                    </button>


                    <button
                        class="desk-drawer"
                        data-page="compilerPage">

                        <span class="drawer-label">
                            COMPILER
                        </span>

                        <span class="drawer-handle"></span>

                    </button>


                    <button
                        class="desk-drawer"
                        data-page="filesPage">

                        <span class="drawer-label">
                            FILES
                        </span>

                        <span class="drawer-handle"></span>

                    </button>

                </nav>

            </section>

        </div>

    </section>


    <!-- =========================================================
         TOKENIZER
         ========================================================= -->

    <section
        id="tokenizerPage"
        class="page">

        <div class="page-panel">

            <div id="tokenizerOutput"></div>

        </div>

    </section>


    <!-- =========================================================
         COMPILER
         ========================================================= -->

    <section
        id="compilerPage"
        class="page">

        <div class="page-panel">

            <div id="compilerOutput"></div>

        </div>

    </section>


    <!-- =========================================================
         FILES
         ========================================================= -->

    <section
        id="filesPage"
        class="page">

        <div class="page-panel">

            <div class="file-controls">

                <button id="saveJsonButton">
                    SAVE JSON
                </button>

                <button id="loadJsonButton">
                    LOAD JSON
                </button>

                <button id="saveGraphButton">
                    SAVE GRAPH
                </button>

                <button id="loadGraphButton">
                    LOAD GRAPH
                </button>

                <input
                    id="fileInput"
                    type="file"
                    accept=".json">

            </div>

        </div>

    </section>

</main>


<!-- =============================================================
     SOURCE FILES
     ============================================================= -->

<script src="src/track-segment.js"></script>
<script src="src/track-editor.js"></script>
<script src="src/track.js"></script>
<script src="src/physics-engine.js"></script>
<script src="src/simulator.js"></script>
<script src="src/file-manager.js"></script>
<script src="src/tokenizer.js"></script>
<script src="src/compiler.js"></script>
<script src="app.js"></script>

</body>
</html>
